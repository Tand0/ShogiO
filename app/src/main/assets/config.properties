#
#
# 最小レート。
#   読込時に最小レート以下の棋譜は読込まない。
#   ただし、0の場合はレートのチェックをしない。
app.rate.min = 2000
# app.rate.min = 0
#
# 大量の棋譜ののあるzipファイル名
app.load.target.01 = E:/assets/target/book.zip
app.load.target.02 = E:/assets/target/2020.zip
app.load.target.03 = E:/assets/target/2021.zip
app.load.target.04 = E:/assets/target/2022.zip
app.load.target.05 = E:/assets/target/2023.zip
app.load.target.06 = E:/assets/target/2024.zip
app.load.target.07 = E:/assets/target/2025.zip
app.load.target.08 = E:/assets/target/wdoor2026.7z
#
# ボーダーライン// これより小さい値は定跡として持たない
app.border = 40
#
# チャネルの最大数
app.channel.max = 16


# 全テーブルをDB化したもの
app.db.all = E:/assets/data/mytable_all.db

# 全テーブルをDB化したもの
app.db.total = E:/assets/data/mytable_total.db

# 棋譜をボーダーで縮小したもの
app.db.small = E:/assets/data/mytable_small.db

# 棋譜をボーダーで縮小したものを学習させたもの
app.db.eval = E:/assets/data/mytable_eval.db

# ダメな手を生成する
app.db.bad = E:/assets/data/mytable_bad.db

# 評価用
app.db.estimate = E:/assets/data/mytable_estimate.db

# 棋譜を小さくしたものの残り物
app.db.remain = E:/assets/data/mytable_remain.db

# dataset の全体
app.dataset.all = E:/assets/data/dataset_all

# プライバシーポリシーの配置位置
url.policy = https://github.com/Tand0/ShogiO/blob/main/praivacy.md

# レポートの配置位置
url.report = https://github.com/Tand0/ShogiO/issues
